<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Journal</title>
    <style>
      :root {
        --bg: #fbfaf7;
        --fg: #22211f;
        --muted: #7a766f;
        --line: #e4e0d8;
        --accent: #b1040e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17161a;
          --fg: #e8e5df;
          --muted: #9a958d;
          --line: #2e2c31;
          --accent: #ff6b6b;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          18px/1.65 Georgia,
          "Times New Roman",
          serif;
      }
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 56px 16px;
      }
      h1 {
        font-weight: 400;
        margin: 0 0 32px;
      }
      [hidden] {
        display: none !important;
      }
      form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      input,
      button {
        font: inherit;
        font-size: 16px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
      }
      input {
        flex: 1;
        min-width: 0;
      }
      button {
        cursor: pointer;
      }
      #remember-label {
        flex-basis: 100%;
        font-size: 15px;
        color: var(--muted);
      }
      #remember-label input {
        flex: none;
        padding: 0;
      }
      #forget {
        margin-top: 24px;
        font-size: 14px;
        color: var(--muted);
      }
      #error {
        color: var(--accent);
        font-size: 15px;
      }
      article {
        border-top: 1px solid var(--line);
        padding: 24px 0;
      }
      time {
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.04em;
      }
      h2 {
        font-size: 22px;
        font-weight: 400;
        margin: 4px 0 0;
      }
      article p {
        margin: 12px 0 0;
      }
      article h3,
      article h4,
      article h5 {
        margin: 24px 0 0;
        line-height: 1.3;
      }
      article h3 {
        font-size: 20px;
      }
      article h4 {
        font-size: 18px;
      }
      article h5 {
        font-size: 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Journal</h1>
      <form id="unlock">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus required />
        <button type="submit">Unlock</button>
        <label id="remember-label"><input id="remember" type="checkbox" checked /> Remember this browser</label>
      </form>
      <p id="error" hidden></p>
      <div id="entries"></div>
      <button id="forget" hidden>Forget this browser</button>
    </main>
    <script>
      const SAVED = "journal-key";
      const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      // blank lines split paragraphs; "# ", "## ", "### " lines become headings under the entry title
      const paras = (body) => {
        let html = "",
          lines = [];
        const flush = () => {
          if (lines.length) html += `<p>${lines.map(esc).join("<br>")}</p>`;
          lines = [];
        };
        for (const line of body.split("\n")) {
          const h = line.match(/^(#{1,3})\s+(.*)/);
          if (h) {
            flush();
            html += `<h${h[1].length + 2}>${esc(h[2].trim())}</h${h[1].length + 2}>`;
          } else if (line.trim()) lines.push(line.trim());
          else flush();
        }
        flush();
        return html;
      };
      const form = document.getElementById("unlock");
      const error = document.getElementById("error");
      let data;
      const load = async () => (data ??= await (await fetch("assets/journal/journal.enc.json", { cache: "no-store" })).json());

      // decrypts and shows the entries; returns false if the key is wrong
      async function open(key) {
        let plain;
        try {
          plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(data.iv) }, key, bytes(data.ciphertext));
        } catch {
          return false;
        }
        const entries = JSON.parse(new TextDecoder().decode(plain));
        document.getElementById("entries").innerHTML = entries.length
          ? entries.map((x) => `<article><time>${esc(x.date)}</time>${x.title ? `<h2>${esc(x.title)}</h2>` : ""}${paras(x.body)}</article>`).join("")
          : "<p>No entries yet.</p>";
        form.hidden = true;
        return true;
      }

      // a remembered browser keeps the derived key (never the password) and unlocks on load
      (async () => {
        let saved;
        try {
          saved = JSON.parse(localStorage.getItem(SAVED));
        } catch {}
        if (!saved) return;
        try {
          await load();
          const key = await crypto.subtle.importKey("raw", bytes(saved.key), "AES-GCM", false, ["decrypt"]);
          if (saved.salt === data.salt && (await open(key))) return (document.getElementById("forget").hidden = false);
        } catch {}
        try {
          localStorage.removeItem(SAVED);
        } catch {}
      })();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const button = form.querySelector("button");
        const remember = document.getElementById("remember").checked;
        error.hidden = true;
        button.disabled = true;
        try {
          await load();
          const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("password").value), "PBKDF2", false, [
            "deriveKey",
          ]);
          const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: bytes(data.salt), iterations: data.iterations, hash: "SHA-256" },
            baseKey,
            { name: "AES-GCM", length: 256 },
            remember,
            ["decrypt"]
          );
          if (!(await open(key))) throw new Error("Wrong password.");
          if (remember) {
            try {
              localStorage.setItem(SAVED, JSON.stringify({ salt: data.salt, key: b64(await crypto.subtle.exportKey("raw", key)) }));
              document.getElementById("forget").hidden = false;
            } catch {}
          }
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
        } finally {
          button.disabled = false;
        }
      });

      document.getElementById("forget").addEventListener("click", () => {
        try {
          localStorage.removeItem(SAVED);
        } catch {}
        location.reload();
      });
    </script>
  </body>
</html>
